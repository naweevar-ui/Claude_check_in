<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>เข้าสู่ระบบผู้ดูแล · Check ชื่อคลาส Claude AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Mali:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;
--bg:light-dark(#f3f8ff,#0d1828);--card:light-dark(#fff,#16263d);--ink:light-dark(#163150,#e7f0fc);--mute:light-dark(#5b7490,#9fb3cb);
--line:light-dark(#d8e7f7,#26405f);--sky:light-dark(#d3e8ff,#22436c);--sky2:light-dark(#e9f4ff,#182c47);--blue:light-dark(#3b8be3,#7ab8ff);--deep:light-dark(#1c5ca3,#b3d6ff);
--pink:light-dark(#ffe1ec,#4a2638);--pinkI:light-dark(#b8467a,#ffb8d5);--pink2:light-dark(#fff0f6,#2a1a2a);
--peach:light-dark(#ffe5d9,#4b2e27);--peachI:light-dark(#ad4e2c,#ffc3a9);--mint:light-dark(#d5f4e8,#1b463c);--mintI:light-dark(#1d7656,#9fe6cb);
--dot:light-dark(#dce9f9,#18294a);--fd:Mali,"IBM Plex Sans Thai",sans-serif;--sh:0 1px 2px rgb(30 80 140/.06),0 18px 50px rgb(30 80 140/.14)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 1.4px,transparent 1.6px);background-size:26px 26px;color:var(--ink);font:16px/1.6 "IBM Plex Sans Thai",system-ui,sans-serif}
h1,h2{font-family:var(--fd);margin:0;line-height:1.4}
button,a{font:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.card{position:relative;width:min(440px,100%);background:var(--card);border-radius:32px;box-shadow:var(--sh);overflow:hidden}
.top{position:relative;overflow:hidden;padding:30px 28px 54px;text-align:center;background:linear-gradient(135deg,var(--sky) 0%,var(--sky2) 50%,var(--pink2) 78%,var(--pink) 100%)}
.cloud{position:absolute;border-radius:50%;background:light-dark(#fff,#1d3352);opacity:.7}.cloud.pk{background:var(--pink)}
.buddy{position:relative;width:150px;height:auto;overflow:visible}
.bob{animation:bob 3.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-6px)}}
.spk{animation:tw 2.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}@keyframes tw{50%{transform:scale(.6);opacity:.5}}
.top h1{position:relative;font-size:clamp(24px,6vw,30px);margin-top:6px}
.top p{position:relative;margin:4px 0 0;color:var(--deep)}
.wave{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:34px;display:block}
.body{padding:8px 28px 28px;display:grid;gap:16px}
.g{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;height:56px;border-radius:18px;border:1.5px solid var(--line);
  background:var(--card);color:var(--ink);font-weight:600;font-size:17px;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s}
.g:hover{border-color:var(--blue);box-shadow:0 6px 18px rgb(59 139 227/.18);transform:translateY(-1px)}
.g:disabled{opacity:.6;cursor:progress;transform:none}
.g svg{width:22px;height:22px;flex:none}
.hint{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--sky2);color:var(--deep);font-size:14px}
.hint svg{width:18px;height:18px;flex:none;margin-top:3px}
.msg{margin:0;padding:12px 14px;border-radius:16px;font-size:14px}
.msg.err{background:var(--peach);color:var(--peachI)}.msg.ok{background:var(--mint);color:var(--mintI)}
.who{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;border:1.5px solid var(--line)}
.who img,.who .av{width:44px;height:44px;border-radius:50%;flex:none;background:var(--pink);display:grid;place-items:center;font-weight:700;color:var(--pinkI)}
.who b{display:block}.who small{color:var(--mute)}
.pri{background:linear-gradient(135deg,var(--blue),#f08bb8);color:#fff;border:0}
.pri:hover{box-shadow:0 8px 22px rgb(240 139 184/.35)}
.back{justify-self:center;color:var(--deep);text-decoration:underline;text-underline-offset:3px;font-size:15px}
.spin{width:20px;height:20px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--blue);animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.bob,.spk,.spin{animation:none}}
</style>
</head>
<body>
<main class="card">
  <div class="top">
    <span class="cloud" style="width:160px;height:160px;right:-50px;top:-70px"></span>
    <span class="cloud pk" style="width:90px;height:90px;left:-30px;top:30px;opacity:.8"></span>
    <svg class="buddy" viewBox="0 0 210 180" aria-hidden="true">
      <ellipse cx="100" cy="168" rx="58" ry="7" fill="#bcd8f7" opacity=".55"/>
      <g class="bob">
        <path d="M54 136c-21 0-36-15-36-34 0-18 14-32 32-33 4-26 26-44 53-44 23 0 43 14 50 35 21 1 38 18 38 39 0 20-17 37-38 37z" fill="#fff" stroke="#b3d3f6" stroke-width="4"/>
        <ellipse cx="80" cy="92" rx="6.5" ry="8.5" fill="#1f3c63"/><ellipse cx="126" cy="92" rx="6.5" ry="8.5" fill="#1f3c63"/>
        <circle cx="82.5" cy="88.5" r="2.4" fill="#fff"/><circle cx="128.5" cy="88.5" r="2.4" fill="#fff"/>
        <ellipse cx="64" cy="109" rx="11" ry="6.5" fill="#ffc6db"/><ellipse cx="142" cy="109" rx="11" ry="6.5" fill="#ffc6db"/>
        <path d="M92 107q11 11 22 0" fill="none" stroke="#1f3c63" stroke-width="4" stroke-linecap="round"/>
        <g transform="translate(150 98) rotate(10)"><rect width="40" height="30" rx="7" fill="#ffe4ee" stroke="#f29cc3" stroke-width="3"/><path d="M10 0v-8a10 10 0 0 1 20 0v8" fill="none" stroke="#f29cc3" stroke-width="4"/><circle cx="20" cy="15" r="4" fill="#c0508a"/></g>
      </g>
      <path class="spk" d="M26 34l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#f49ac1"/>
      <path class="spk" style="animation-delay:.9s" d="M184 14l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#8cc2ff"/>
    </svg>
    <h1>สำหรับผู้ดูแลคลาส</h1>
    <p>เข้าสู่ระบบเพื่อจัดการรายชื่อและดูแดชบอร์ด</p>
    <svg class="wave" viewBox="0 0 440 34" preserveAspectRatio="none" aria-hidden="true"><path d="M0 20C70 34 140 4 220 14s150 20 220 6V34H0z" fill="var(--card)"/></svg>
  </div>

  <div class="body">
    <p class="msg err" id="err" role="alert" hidden></p>

    <div id="vLogin">
      <div style="display:grid;gap:16px">
        <button class="g" id="bGoogle" type="button">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
          <span id="gTx">เข้าสู่ระบบด้วย Google</span>
        </button>
        <div class="hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5m0 3v.01"/></svg>
          <span>เฉพาะบัญชี Gmail ที่ได้รับสิทธิ์ผู้ดูแลเท่านั้น ผู้เข้าเรียนเช็คชื่อได้เลยโดยไม่ต้องเข้าสู่ระบบ</span></div>
      </div>
    </div>

    <div id="vWait" hidden style="display:flex;gap:12px;align-items:center;justify-content:center;color:var(--mute)"><span class="spin"></span><span id="waitTx">กำลังตรวจสอบสิทธิ์…</span></div>

    <div id="vIn" hidden style="display:grid;gap:14px">
      <div class="who"><span class="av" id="wAv">?</span><div><b id="wName"></b><small id="wMail"></small></div></div>
      <p class="msg ok">ยืนยันสิทธิ์ผู้ดูแลแล้ว</p>
      <a class="g pri" href="./" id="bGo" style="text-decoration:none">ไปหน้าเช็คชื่อและแดชบอร์ด</a>
      <button class="g" id="bOut" type="button">ออกจากระบบ</button>
    </div>

    <a class="back" href="./">← กลับไปหน้าเช็คชื่อ</a>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js?v=2.0.0"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const C = window.CHECKIN_CONFIG || {};
  const show = v => ['vLogin', 'vWait', 'vIn'].forEach(id => { $('#' + id).hidden = id !== v });
  const err = m => { $('#err').textContent = m; $('#err').hidden = !m };
  if (!C.SUPABASE_URL || !C.SUPABASE_KEY || !window.supabase) {
    err('ยังไม่ได้ตั้งค่า Supabase ในไฟล์ config.js หรือโหลดไลบรารีไม่สำเร็จ');
    $('#bGoogle').disabled = true; return;
  }
  const sb = window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_KEY);
  const here = location.origin + location.pathname;

  const q = new URLSearchParams(location.search + '&' + location.hash.slice(1));
  if (q.get('error_description')) err('เข้าสู่ระบบไม่สำเร็จ: ' + q.get('error_description').replace(/\+/g, ' '));

  $('#bGoogle').onclick = async () => {
    err(''); $('#bGoogle').disabled = true; $('#gTx').textContent = 'กำลังไปหน้า Google…';
    const { error } = await sb.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: here, queryParams: { prompt: 'select_account', login_hint: C.ADMIN_EMAIL || '' } }
    });
    if (error) { err('เปิดหน้าเข้าสู่ระบบไม่สำเร็จ: ' + error.message); $('#bGoogle').disabled = false; $('#gTx').textContent = 'เข้าสู่ระบบด้วย Google' }
  };
  $('#bOut').onclick = async () => { await sb.auth.signOut(); show('vLogin') };

  async function check(session) {
    if (!session) { show('vLogin'); return }
    show('vWait');
    const u = session.user, mail = u.email || '';
    const { data, error } = await sb.rpc('is_admin');
    if (error || data !== true) {
      await sb.auth.signOut();
      err(error ? 'ตรวจสอบสิทธิ์ไม่สำเร็จ ลองใหม่อีกครั้ง' : `บัญชี ${mail} ไม่มีสิทธิ์ผู้ดูแล กรุณาเลือกบัญชีผู้ดูแลคลาส`);
      show('vLogin'); return;
    }
    const name = (u.user_metadata && (u.user_metadata.full_name || u.user_metadata.name)) || mail;
    $('#wName').textContent = name; $('#wMail').textContent = mail;
    const pic = u.user_metadata && u.user_metadata.avatar_url;
    if (pic) { const i = new Image(); i.alt = ''; i.referrerPolicy = 'no-referrer'; i.src = pic; i.onload = () => $('#wAv').replaceWith(i) }
    else $('#wAv').textContent = name.slice(0, 1).toUpperCase();
    show('vIn');
    if (q.get('code') || location.hash.includes('access_token')) { $('#waitTx').textContent = 'กำลังพาไปหน้าเช็คชื่อ…'; setTimeout(() => location.replace('./'), 900) }
  }
  sb.auth.onAuthStateChange((_ev, session) => { setTimeout(() => check(session), 0) });
})();
</script>
</body>
</html>
